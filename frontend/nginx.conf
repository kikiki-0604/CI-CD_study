server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # APIはバックエンドのコンテナへ中継する(ブラウザからは同じドメインに見える)。
    # 変数経由にすることで、バックエンドが未起動でも nginx 自体は起動できる。
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI(Bedrock)の応答は時間がかかることがあるため、長めにする
        proxy_read_timeout 60s;
    }

    # React Router のURL(/candidates など)をリロードしても index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }
}
